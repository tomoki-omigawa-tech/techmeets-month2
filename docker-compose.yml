services:
  # Nginx（Webサーバー）
  nginx:
    image: nginx:latest
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # PHP-FPM（アプリケーション）
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

# 仮想ネットワーク（同じネットワーク内のコンテナはサービス名で通信できる）
networks:
  app-network:
    driver: bridge
